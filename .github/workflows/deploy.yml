name: Deploy to Netlify (manual fallback)

# DISABLED on push: the Netlify site is now connected to the GitHub repo
# directly (base directory: frontend) and builds from frontend/netlify.toml,
# which is the supported path. This workflow's netlify-cli upload was failing
# on every push, which silently left the live site on a stale bundle.
#
# Kept as a manual escape hatch: run it from the Actions tab only if the
# Netlify-side build is misconfigured.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ecommerce-backend-2gas.onrender.com/api

      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --site 8a6d1112-07cf-427b-8096-b89765a85122 --dir dist --functions netlify/functions --prod --message "Auto-deploy from GitHub Actions (monorepo)"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VITE_API_BASE_URL: https://ecommerce-backend-2gas.onrender.com/api