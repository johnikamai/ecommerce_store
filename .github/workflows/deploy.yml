name: Deploy to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ecommerce-backend-o9eg.onrender.com/api

      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --site 8a6d1112-07cf-427b-8096-b89765a85122 --dir dist --functions netlify/functions --prod --message "Auto-deploy from GitHub Actions (monorepo)"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}