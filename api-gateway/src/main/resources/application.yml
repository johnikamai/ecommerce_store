server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:[*]"
              - "http://127.0.0.1:[*]"
              - "https://*.vercel.app"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/api/customers/**,/api/staff/**,/api/admin/staff/**,/api/admin/users/**
          filters:
            - AddResponseHeader=X-ShopEase-Backend, auth-service
        # Only these public reads have moved to product-service.
        - id: product-read-service
          uri: ${PRODUCT_SERVICE_URI:lb://product-service}
          predicates:
            - Method=GET
            - Path=/api/products,/api/products/{id:[0-9]+},/api/categories
          filters:
            - AddResponseHeader=X-ShopEase-Backend, product-service
        # Explicit transitional fallback; keeps original JWT and ownership rules.
        - id: monolith-compatibility
          uri: ${COMPATIBILITY_URI:http://localhost:8087}
          predicates:
            - Path=/api/**,/products/**,/product-photos/**,/images/**,/health
          filters:
            - AddResponseHeader=X-ShopEase-Backend, monolith-compatibility

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
