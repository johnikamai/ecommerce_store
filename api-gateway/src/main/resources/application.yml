server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "https://*.vercel.app"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/api/customers/**,/api/staff/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/reviews/**,/api/compatibility/**,/api/search/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**,/api/group-orders/**,/api/returns/**,/api/restock-requests/**,/api/addresses/**,/api/cart/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**,/api/coupons/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**,/api/admin/alerts/**
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/recommendations/**,/api/assistant/**,/api/gift-finder/**,/api/wishlist/**,/api/price-history/**

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
