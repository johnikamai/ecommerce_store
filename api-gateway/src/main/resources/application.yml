server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:[*]"
              - "http://127.0.0.1:[*]"
              - "https://*.vercel.app"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: order-payment-commands
          uri: lb://order-service
          predicates:
            - Method=POST,PUT
            - Path=/api/payments,/api/payments/*/status
          filters:
            - AddResponseHeader=X-ShopEase-Backend, order-service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**,/api/addresses/**,/api/wishlist/**,/api/returns/**,/api/group-orders/**,/api/admin/group-orders/**
          filters:
            - AddResponseHeader=X-ShopEase-Backend, order-service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**,/api/coupons/**
          filters:
            - AddResponseHeader=X-ShopEase-Backend, payment-service
        - id: product-staff-approvals
          uri: lb://product-service
          predicates:
            - Path=/api/staff/approvals/**,/api/admin/staff/approvals/**,/api/admin/staff/summary
          filters:
            - AddResponseHeader=X-ShopEase-Backend, product-service
        - id: admin-user-report
          uri: lb://recommendation-service
          predicates:
            - Method=GET
            - Path=/api/admin/users
          filters:
            - AddResponseHeader=X-ShopEase-Backend, recommendation-service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/health,/api/auth/**,/api/customers/**,/api/staff/**,/api/admin/staff/**,/api/admin/users/**
          filters:
            - AddResponseHeader=X-ShopEase-Backend, auth-service
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/products/*/recommendations,/api/recommendations/**,/api/assistant/**,/api/gift-finder/**,/api/admin/dashboard,/api/admin/sales-report,/api/admin/reports/**,/api/admin/customers/**
          filters:
            - AddResponseHeader=X-ShopEase-Backend, recommendation-service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - AddResponseHeader=X-ShopEase-Backend, notification-service
        - id: product-service
          uri: ${PRODUCT_SERVICE_URI:lb://product-service}
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/reviews/**,/api/restock-requests/**,/api/compatibility/**,/api/admin/catalog/**,/api/admin/alerts/**,/api/admin/reviews/**,/products/**,/product-photos/**,/images/**
          filters:
            - AddResponseHeader=X-ShopEase-Backend, product-service

eureka:
  client:
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info

spring.cloud.loadbalancer.cache.ttl: 5s
