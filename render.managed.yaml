# REVIEW ONLY: external managed MySQL. No database or cloud resources are created by this file.
services:
- type: pserv
  name: shopease-discovery
  runtime: docker
  branch: feature/microservices-migration
  region: singapore
  plan: 1c-2g
  dockerfilePath: ./discovery-server/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: shopease-managed-runtime
  - key: SERVICE_HOST
    fromService:
      name: shopease-discovery
      type: pserv
      property: host
  - key: DISCOVERY_HOST
    fromService:
      name: shopease-discovery
      type: pserv
      property: host
  numInstances: 1
- type: web
  name: shopease-gateway
  runtime: docker
  branch: feature/microservices-migration
  region: singapore
  plan: 1c-2g
  dockerfilePath: ./api-gateway/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: shopease-managed-runtime
  - key: SERVICE_HOST
    fromService:
      name: shopease-gateway
      type: web
      property: host
  - key: DISCOVERY_HOST
    fromService:
      name: shopease-discovery
      type: pserv
      property: host
  - key: CORS_ALLOWED_ORIGINS
    fromService:
      name: shopease-auth
      type: pserv
      envVarKey: CORS_ALLOWED_ORIGINS
  healthCheckPath: /actuator/health
  maintenanceMode:
    enabled: true
  numInstances: 1
- type: pserv
  name: shopease-auth
  runtime: docker
  branch: feature/microservices-migration
  region: singapore
  plan: 1c-2g
  dockerfilePath: ./services/auth-service/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: shopease-managed-runtime
  - key: SERVICE_HOST
    fromService:
      name: shopease-auth
      type: pserv
      property: host
  - key: DISCOVERY_HOST
    fromService:
      name: shopease-discovery
      type: pserv
      property: host
  - key: DB_NAME
    value: shopease_auth
  - key: DB_USERNAME
    sync: false
  - key: DB_HOST
    sync: false
  - key: DB_PASSWORD
    sync: false
  - key: CORS_ALLOWED_ORIGINS
    sync: false
  - key: JWT_SECRET
    sync: false
  - key: BREVO_API_KEY
    sync: false
  - key: BREVO_SENDER_EMAIL
    sync: false
  - key: BREVO_SENDER_NAME
    value: ShopEase
  numInstances: 1
- type: pserv
  name: shopease-product
  runtime: docker
  branch: feature/microservices-migration
  region: singapore
  plan: 1c-2g
  dockerfilePath: ./services/product-service/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: shopease-managed-runtime
  - key: SERVICE_HOST
    fromService:
      name: shopease-product
      type: pserv
      property: host
  - key: DISCOVERY_HOST
    fromService:
      name: shopease-discovery
      type: pserv
      property: host
  - key: DB_NAME
    value: shopease_product
  - key: DB_USERNAME
    sync: false
  - key: DB_HOST
    sync: false
  - key: DB_PASSWORD
    sync: false
  numInstances: 1
- type: pserv
  name: shopease-order
  runtime: docker
  branch: feature/microservices-migration
  region: singapore
  plan: 1c-2g
  dockerfilePath: ./services/order-service/Dockerfile
