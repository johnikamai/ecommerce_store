  - key: DB_HOST
    sync: false
  - key: DB_PASSWORD
    sync: false
  numInstances: 1
- type: pserv
  name: shopease-payment
  runtime: docker
  branch: feature/microservices-migration
  region: singapore
  plan: 1c-2g
  dockerfilePath: ./services/payment-service/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: shopease-managed-runtime
  - key: SERVICE_HOST
