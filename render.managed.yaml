- type: pserv
  name: shopease-recommendation
  runtime: docker
  branch: feature/microservices-migration
  region: singapore
  plan: 1c-2g
  dockerfilePath: ./services/recommendation-service/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: shopease-managed-runtime
  - key: SERVICE_HOST
    fromService:
      name: shopease-recommendation
      type: pserv
      property: host
  - key: DISCOVERY_HOST
    fromService:
      name: shopease-discovery
      type: pserv
      property: host
  - key: DB_NAME
    value: shopease_recommendation
  - key: DB_USERNAME
    sync: false
  - key: DB_HOST
    sync: false
  - key: DB_PASSWORD
    sync: false
  numInstances: 1
envVarGroups:
- name: shopease-managed-runtime
  envVars:
  - key: SPRING_PROFILES_ACTIVE
    value: render
  - key: PORT
    value: '10000'
  - key: DISCOVERY_PORT
    value: '10000'
  - key: DB_PORT
    value: '3306'
  - key: DB_SSL_MODE
    value: VERIFY_IDENTITY
  - key: DEMO_PAYMENTS
    value: 'false'
  - key: SERVICE_INTERNAL_KEY
    generateValue: true
  - key: NOTIFICATION_DELIVERY_ENABLED
    value: 'false'
previews:
  generation: 'off'
