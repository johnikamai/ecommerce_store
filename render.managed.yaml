- type: pserv
  name: shopease-notification
  runtime: docker
  branch: feature/microservices-migration
  region: singapore
  plan: 1c-2g
  dockerfilePath: ./services/notification-service/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: shopease-managed-runtime
  - key: SERVICE_HOST
    fromService:
      name: shopease-notification
      type: pserv
      property: host
  - key: DISCOVERY_HOST
    fromService:
      name: shopease-discovery
      type: pserv
      property: host
  - key: DB_NAME
    value: shopease_notification
  - key: DB_USERNAME
    sync: false
  - key: DB_HOST
    sync: false
  - key: DB_PASSWORD
    sync: false
  - key: BREVO_API_KEY
    fromService:
      name: shopease-auth
      type: pserv
      envVarKey: BREVO_API_KEY
  - key: BREVO_SENDER_EMAIL
    fromService:
      name: shopease-auth
      type: pserv
      envVarKey: BREVO_SENDER_EMAIL
  - key: BREVO_SENDER_NAME
    fromService:
      name: shopease-auth
