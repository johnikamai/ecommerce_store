# Netlify build config.
#
# The site is connected to GitHub directly (base directory: frontend), so
# Netlify builds from this file. The old .github/workflows/deploy.yml used
# netlify-cli from Actions and has been reduced to a manual-only fallback.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 declares engines node ^20.19.0 || >=22.12.0. Pinning it here stops
  # the build from breaking whenever Netlify changes its default runtime.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Scheduled pings to the Render backend so the free-tier instance stays warm.
[functions."keepalive.mjs"]
  schedule = "*/5 * * * *"

# SPA fallback for client-side routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200