spring.application.name=ecommerce-system
logging.level.org.springframework.security=DEBUG
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Josh@mo@26}

# Keep a warm pool so queries ride existing connections instead of doing a
# fresh TCP + TLS handshake for every request (that is what makes remote
# databases like Aiven feel "laggy" on every page load).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# For Aiven MySQL, set DB_URL to (mind the SSL params, secret CHARs in the
# password must be URL-encoded, e.g. @ -> %40):
#   jdbc:mysql://HOST:PORT/ecommerce_db?useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.2&connectTimeout=15000&socketTimeout=30000&serverTimezone=UTC
#   > $env:DB_URL = 'jdbc:mysql://HOST:PORT/ecommerce_db?useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.2&connectTimeout=15000&socketTimeout=30000&serverTimezone=UTC'
#   > $env:DB_USERNAME = 'avnadmin'
#   > $env:DB_PASSWORD = '<aiven password>'
#   > java -jar target\ecommerce-system-0.0.1-SNAPSHOT.jar
# verify with:  & "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe" -h HOST -P PORT -u avnadmin -p DbName -e "SELECT 1"

spring.jpa.hibernate.ddl-auto=update

# Real email (Brevo API over HTTPS) for OTP delivery.
# SMTP is not used because some ISPs block outbound SMTP ports.
# Fill in mail-credentials.properties (in the project root) with your Brevo
# API key + verified sender email. While it's empty/absent, OTPs are only
# shown on-screen (demo).
spring.config.import=optional:file:./mail-credentials.properties