spring.application.name=ecommerce-system
logging.level.org.springframework.security=INFO
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Keep a warm pool so queries ride existing connections instead of doing a
# fresh TCP + TLS handshake for every request (that is what makes remote
# databases like Aiven feel "laggy" on every page load).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# For Aiven MySQL, set DB_URL to (mind the SSL params, secret CHARs in the
# password must be URL-encoded, e.g. @ -> %40):
#   jdbc:mysql://HOST:PORT/ecommerce_db?useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.2&connectTimeout=15000&socketTimeout=30000&serverTimezone=UTC
#   > $env:DB_URL = 'jdbc:mysql://HOST:PORT/ecommerce_db?useSSL=true&requireSSL=true&enabledTLSProtocols=TLSv1.2&connectTimeout=15000&socketTimeout=30000&serverTimezone=UTC'
#   > $env:DB_USERNAME = 'avnadmin'
#   > $env:DB_PASSWORD = '<aiven password>'
#   > java -jar target\ecommerce-system-0.0.1-SNAPSHOT.jar
# verify with:  & "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe" -h HOST -P PORT -u avnadmin -p DbName -e "SELECT 1"

spring.jpa.hibernate.ddl-auto=update

# Real email (Brevo API over HTTPS) for OTP delivery.
# SMTP is not used because some ISPs block outbound SMTP ports.
# Fill in mail-credentials.properties (in the project root) with your Brevo
# API key + verified sender email. While it's empty/absent, OTPs are only
# shown on-screen (demo).
spring.config.import=optional:file:./mail-credentials.properties

# Where low-stock emails go (blank = admin email disabled). Defaults to the
# ADMIN_EMAIL used by AdminSeeder if you set it here.
admin.alert.email=${ADMIN_EMAIL:admin@shopease.com}
app.admin.orders-url=${ADMIN_ORDERS_URL:https://shopease-storefront.netlify.app/admin/orders}

# Transactional SMS via the Twilio REST API (no SDK, HTTPS only).
# Leave blank and SMS simply stays dormant - email + in-app still work.
# Render env vars: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER
twilio.account.sid=
twilio.auth.token=
twilio.from.number=
# Country code prefixed to bare 10-digit phone numbers.
sms.default.country.code=91
# Force SMS on/off. Unset = enabled automatically once the three vars above exist.
sms.enabled=
# Online demo payments require explicit opt-in. Otherwise checkout supports COD only.
app.payments.demo-enabled=${DEMO_PAYMENTS_ENABLED:false}
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:ShopEase}
# Set true for one startup to reconcile rewards from legacy orders, then unset.
app.rewards.reconcile=${RECONCILE_REWARDS:false}
